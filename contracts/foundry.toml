[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "cancun" # Base supports cancun now, or "paris" if older. Let's use paris to be safe, or just let it default to latest base. Base uses canyon/cancun. Let's use "shanghai" as a safe modern default.

[rpc_endpoints]
base = "${RPC_URL_HTTP:-https://mainnet.base.org}"
